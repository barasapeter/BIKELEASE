<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIKELEASE — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<!-- LEFT -->
<div class="left">
  <div class="logo">BIKE<span>LEASE</span></div>

  <div class="left-body">
    <div class="eyebrow">Your urban fleet</div>
    <h2>RIDE<br>ON YOUR<br><em>TERMS.</em></h2>
    <p>Lease premium bikes by the day, week, or month. Pick up from any of our hubs — no contracts, no hassle.</p>
  </div>

  <div class="stat-strip">
    <div>
      <div class="s-num">200<span>+</span></div>
      <div class="s-lbl">Bikes available</div>
    </div>
    <div>
      <div class="s-num">18</div>
      <div class="s-lbl">City hubs</div>
    </div>
    <div>
      <div class="s-num">4.9<span>★</span></div>
      <div class="s-lbl">Avg. rating</div>
    </div>
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="form-wrap">

    <div class="form-header">
      <h1>SIGN IN</h1>
      <p>No account? <a href="#">Create one free →</a></p>
    </div>

    <div class="field">
      <label>Username</label>
      <input type="text" placeholder="tom" id="username">
    </div>

    <div class="field">
      <div class="field-row">
        <label>PIN</label>
        <a href="#">Forgot PIN?</a>
      </div>
      <input id="pin" type="password" placeholder="••••" autocomplete="current-password">
    </div>
    <!-- default user is "owner" -->

    <label class="remember">
      <input type="checkbox">
      <span>Keep me signed in</span>
    </label>

    <button id="loginBtn" class="btn-primary">CONTINUE</button>

    <div class="divider"><span>OR</span></div>

    <button class="btn-ghost">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
  </div>
</div>
<script src="/static/js/login.js"></script>

</body>
</html>

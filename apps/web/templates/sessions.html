<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIKELEASE — Sessions</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --asphalt:   #0F1014;
    --carbon:    #1C1E26;
    --steel:     #2A2D38;
    --smoke:     #4A4F63;
    --mist:      #8A8FA8;
    --chalk:     #F0F0F5;
    --white:     #FFFFFF;
    --volt:      #C8F400;
    --volt-dim:  #9BBF00;
    --ember:     #FF4D1C;
    --ember-dim: #CC3C14;
    --sky:       #38B6FF;
    --sky-dim:   #1A8FCC;
  }

  body {
    background: var(--asphalt);
    color: var(--chalk);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--carbon);
    border-bottom: 1px solid var(--steel);
    padding: 0 40px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    display: none;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: var(--chalk);
  }
  .logo span { color: var(--volt); }
  .header-meta {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--smoke);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── PAGE TITLE ── */
  .page-header {
    padding: 48px 40px 32px;
    border-bottom: 1px solid var(--steel);
    position: relative;
    overflow: hidden;
  }
  .page-header::after {
    content: 'SESSIONS';
    position: absolute;
    right: -10px;
    top: -10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 14vw, 160px);
    color: var(--carbon);
    letter-spacing: -2px;
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }
  .page-badge {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--volt);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    display: none;
  }
  .page-badge::before { content: ''; width: 28px; height: 1px; background: var(--volt); }
  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    letter-spacing: 2px;
    line-height: 1;
    position: relative;
    z-index: 1;
  }
  .page-title span { color: var(--volt); }
  .shop-id-display {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--smoke);
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }

  /* ── CONTENT AREA ── */
  .content {
    padding: 32px 40px;
  }

  /* ── ERROR STATE ── */
  .error-state {
    display: none;
    background: rgba(255,77,28,0.08);
    border: 1px solid rgba(255,77,28,0.3);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 24px;
    color: var(--ember);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }
  .error-state.visible { display: block; }

  /* ── SKELETON ── */
  @keyframes shimmer {
    0%   { background-position: -600px 0; }
    100% { background-position: 600px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, var(--carbon) 25%, var(--steel) 50%, var(--carbon) 75%);
    background-size: 600px 100%;
    animation: shimmer 1.4s infinite linear;
    border-radius: 6px;
  }

  .skeleton-row {
    background: var(--carbon);
    border: 1px solid var(--steel);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 48px 1fr 1fr 1fr 1fr 1fr 80px;
    gap: 20px;
    align-items: center;
  }
  .skel-avatar { width: 48px; height: 48px; border-radius: 50%; }
  .skel-line   { height: 12px; }
  .skel-short  { height: 12px; width: 60%; }
  .skel-badge  { height: 28px; width: 80px; border-radius: 20px; }
  .skel-btn    { height: 32px; border-radius: 8px; }

  /* ── TABLE HEADER ── */
  .table-header {
    display: none;
    grid-template-columns: 48px 1.4fr 1fr 1.2fr 0.9fr 0.9fr 96px;
    gap: 20px;
    padding: 0 24px 12px;
    align-items: center;
  }
  .table-header span {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--smoke);
    text-transform: uppercase;
  }

  /* ── SESSION ROW ── */
  .sessions-list { display: none; }

  .session-row {
    background: var(--carbon);
    border: 1px solid var(--steel);
    border-radius: 12px;
    padding: 16px 24px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 48px 1.4fr 1fr 1.2fr 0.9fr 0.9fr 96px;
    gap: 20px;
    align-items: center;
    transition: border-color 0.2s ease, background 0.2s ease;
    cursor: default;
  }
  .session-row:hover {
    border-color: var(--smoke);
    background: #21242e;
  }
  .session-row.ongoing {
    border-color: rgba(200, 244, 0, 0.25);
  }
  .session-row.ongoing:hover {
    border-color: rgba(200, 244, 0, 0.45);
  }

  /* Avatar */
  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--steel);
    flex-shrink: 0;
  }

  /* Customer cell */
  .cell-customer {}
  .customer-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--chalk);
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .customer-phone {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--mist);
  }

  /* Bike cell */
  .cell-bike {
    font-size: 13px;
    color: var(--mist);
  }
  .bike-name {
    color: var(--chalk);
    font-weight: 500;
    font-size: 13px;
    margin-bottom: 2px;
  }
  .bike-id {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--smoke);
  }

  /* Time cells */
  .cell-time {
    font-size: 12px;
    color: var(--mist);
  }
  .time-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--smoke);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .time-value {
    font-size: 13px;
    color: var(--chalk);
  }

  /* Duration badge */
  .badge-duration {
    display: inline-flex;
    align-items: center;
    padding: 5px 12px;
    border-radius: 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .badge-done {
    background: rgba(138,143,168,0.12);
    color: var(--mist);
  }
  .badge-ongoing {
    background: rgba(200,244,0,0.12);
    color: var(--volt);
  }

  /* Amount */
  .cell-amount {}
  .amount-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--chalk);
    line-height: 1;
  }
  .amount-value.ongoing {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--volt);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .amount-currency {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--smoke);
    letter-spacing: 2px;
    margin-top: 1px;
  }

  /* Action button */
  .btn-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    border: none;
    letter-spacing: 0.3px;
    transition: opacity 0.15s ease, transform 0.15s ease;
    white-space: nowrap;
  }
  .btn-action:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-action:active { transform: translateY(0); }

  .btn-print {
    background: var(--steel);
    color: var(--chalk);
  }
  .btn-stop {
    background: var(--ember);
    color: var(--white);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: none;
    text-align: center;
    padding: 80px 40px;
    color: var(--smoke);
  }
  .empty-state.visible { display: block; }
  .empty-icon {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    color: var(--steel);
    line-height: 1;
    margin-bottom: 16px;
  }
  .empty-state p {
    font-size: 14px;
    color: var(--mist);
  }

  /* ── COUNT CHIP ── */
  .count-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--steel);
    border-radius: 20px;
    padding: 4px 12px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--mist);
    margin-left: 16px;
    vertical-align: middle;
  }
  .count-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--smoke);
  }
  .count-chip .dot.active {
    background: var(--volt);
    box-shadow: 0 0 6px var(--volt);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 1024px) {
    .session-row,
    .table-header {
      grid-template-columns: 48px 1.4fr 1fr 0.9fr 80px;
    }
    .cell-time.start-col { display: none; }
    .cell-time.stop-col  { display: none; }
    .th-start, .th-stop  { display: none; }
  }

  @media (max-width: 768px) {
    .header        { padding: 0 20px; }
    .page-header   { padding: 36px 20px 24px; }
    .content       { padding: 20px; }
    .table-header  { display: none !important; }

    .session-row {
      grid-template-columns: 48px 1fr;
      grid-template-rows: auto auto auto;
      gap: 10px 16px;
      padding: 16px;
    }
    .avatar { grid-row: 1 / 3; }
    .cell-customer { grid-column: 2; }
    .cell-bike  { grid-column: 2; }
    .cell-time  { display: none; }
    .cell-duration { grid-column: 1 / 3; }
    .cell-amount   { grid-column: 1; }
    .cell-action   { grid-column: 2; justify-self: end; }

    .skeleton-row {
      grid-template-columns: 48px 1fr 80px;
    }
    .skel-col3, .skel-col4, .skel-col5 { display: none; }
  }

  /* ── FADE IN ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .session-row {
    animation: fadeUp 0.3s ease both;
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">BIKE<span>LEASE</span></div>
  <div class="header-meta" id="header-meta">Loading sessions…</div>
</header>

<!-- PAGE TITLE -->
<div class="page-header">
  <div class="page-badge">Rental Activity</div>
  <h1 class="page-title">ALL <span>SESSIONS</span><span class="count-chip" id="count-chip" style="display:none"><span class="dot active" id="live-dot"></span><span id="count-text">0</span></span></h1>
  <div class="shop-id-display" id="shop-id-display">SHOP — …</div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- ERROR -->
  <div class="error-state" id="error-state"></div>

  <!-- SKELETON -->
  <div id="skeleton-list">
    <!-- Table header placeholder -->
    <div style="display:grid;grid-template-columns:48px 1.4fr 1fr 1.2fr 0.9fr 0.9fr 96px;gap:20px;padding:0 24px 12px;margin-bottom:4px;">
      <span></span>
      <span class="skeleton" style="height:9px;width:60px;margin-top:4px;border-radius:4px;"></span>
      <span class="skeleton" style="height:9px;width:40px;margin-top:4px;border-radius:4px;"></span>
      <span class="skeleton" style="height:9px;width:50px;margin-top:4px;border-radius:4px;"></span>
      <span class="skeleton" style="height:9px;width:45px;margin-top:4px;border-radius:4px;"></span>
      <span class="skeleton" style="height:9px;width:50px;margin-top:4px;border-radius:4px;"></span>
      <span></span>
    </div>
    <!-- Skeleton rows -->
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:55%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:35%;"></div></div>
      <div><div class="skeleton skel-short"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:50%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:70%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:40%;"></div></div>
      <div><div class="skeleton skel-short" style="width:80%;"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short" style="width:70%;"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge" style="width:90px;"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:40%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:50%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:45%;"></div></div>
      <div><div class="skeleton skel-short" style="width:65%;"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short" style="width:80%;"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge" style="width:68px;"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:55%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:30%;"></div></div>
      <div><div class="skeleton skel-short" style="width:75%;"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short" style="width:60%;"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge" style="width:100px;"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:45%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:45%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:38%;"></div></div>
      <div><div class="skeleton skel-short" style="width:85%;"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short" style="width:55%;"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge" style="width:76px;"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:50%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
  </div>

  <!-- TABLE HEADER (visible after load) -->
  <div class="table-header" id="table-header">
    <span></span>
    <span>Customer</span>
    <span>Bike</span>
    <span class="th-start">Started</span>
    <span class="th-stop">Stopped</span>
    <span>Duration / Amount</span>
    <span></span>
  </div>

  <!-- SESSIONS -->
  <div class="sessions-list" id="sessions-list"></div>

  <!-- EMPTY -->
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">—</div>
    <p>No sessions found for this shop.</p>
  </div>

</div>

<script>
  // ── Helpers ──────────────────────────────────────────────────
  function getShopId() {
    // Expects route like /session/<shop_id>
    const parts = window.location.pathname.split('/').filter(Boolean);
    return parts[parts.length - 1] || null;
  }

  function formatDatetime(dt) {
    if (!dt) return '—';
    const d = new Date(dt);
    if (isNaN(d)) return dt;
    return d.toLocaleString('en-GB', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
  }

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Render ───────────────────────────────────────────────────
  function buildRow(s, index) {
    const isOngoing = s.duration === 'ongoing';
    const photo = escapeHtml(s.photo || '/static/imgs/avatar.png');
    const customer = escapeHtml(s.customer);
    const phone = escapeHtml(s.phone);
    const bike = escapeHtml(s.bike);
    const startFmt = formatDatetime(s.start);
    const stopFmt = s.stop ? formatDatetime(s.stop) : isOngoing ? '<span style="color:var(--volt);font-family:\'Space Mono\',monospace;font-size:10px;letter-spacing:1px;">LIVE</span>' : '—';

    const durationBadge = isOngoing
      ? `<span class="badge-duration badge-ongoing">● ONGOING</span>`
      : `<span class="badge-duration badge-done">${escapeHtml(s.duration)}</span>`;

    const amountHtml = isOngoing
      ? `<div class="amount-value ongoing">ongoing</div>`
      : `<div class="amount-value">KES ${Number(s.amount).toLocaleString()}</div>`;

    const actionBtn = s.action === 'print'
      ? `<button class="btn-action btn-print" onclick="handlePrint('${escapeHtml(s.id)}')">
           <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
           Print
         </button>`
      : `<button class="btn-action btn-stop" onclick="handleStop('${escapeHtml(s.id)}')">
           <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
           Stop
         </button>`;

    return `
      <div class="session-row${isOngoing ? ' ongoing' : ''}" style="animation-delay:${index * 40}ms">
        <img class="avatar" src="${photo}" alt="${customer}" onerror="this.src='/static/imgs/avatar.png'">
        <div class="cell-customer">
          <div class="customer-name">${customer}</div>
          <div class="customer-phone">${phone}</div>
        </div>
        <div class="cell-bike">
          <div class="bike-name">${bike.split(' ')[0]}</div>
          <div class="bike-id">${bike.split(' ').slice(1).join(' ')}</div>
        </div>
        <div class="cell-time start-col">
          <div class="time-label">Start</div>
          <div class="time-value">${startFmt}</div>
        </div>
        <div class="cell-time stop-col">
          <div class="time-label">Stop</div>
          <div class="time-value">${stopFmt}</div>
        </div>
        <div class="cell-duration">
          ${durationBadge}
          <div style="margin-top:6px">${amountHtml}</div>
        </div>
        <div class="cell-action">${actionBtn}</div>
      </div>`;
  }

  // ── Fetch ────────────────────────────────────────────────────
  async function loadSessions() {
    const shopId = getShopId();

    document.getElementById('shop-id-display').textContent =
      `SHOP — ${shopId || 'unknown'}`;

    if (!shopId) {
      showError('No shop ID found in URL.');
      hideSkeleton();
      return;
    }

    try {
      const res = await fetch(`/queries/v1/sessions/${shopId}/all`, {
        credentials: 'include',
        headers: { 'Accept': 'application/json' }
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${res.status}`);
      }

      const sessions = await res.json();
      hideSkeleton();
      renderSessions(sessions);

    } catch (err) {
      hideSkeleton();
      showError(err.message || 'Failed to load sessions.');
    }
  }

  function renderSessions(sessions) {
    const list = document.getElementById('sessions-list');
    const header = document.getElementById('table-header');
    const chip = document.getElementById('count-chip');
    const countText = document.getElementById('count-text');
    const liveDot = document.getElementById('live-dot');
    const headerMeta = document.getElementById('header-meta');

    if (!sessions || sessions.length === 0) {
      document.getElementById('empty-state').classList.add('visible');
      headerMeta.textContent = '0 sessions';
      return;
    }

    const ongoingCount = sessions.filter(s => s.duration === 'ongoing').length;

    // Update header
    headerMeta.textContent = `${sessions.length} session${sessions.length !== 1 ? 's' : ''}${ongoingCount ? ` · ${ongoingCount} live` : ''}`;
    countText.textContent = sessions.length;
    chip.style.display = 'inline-flex';
    if (ongoingCount > 0) {
      liveDot.classList.add('active');
    }

    // Render rows
    list.innerHTML = sessions.map((s, i) => buildRow(s, i)).join('');
    header.style.display = 'grid';
    list.style.display = 'block';
  }

  function hideSkeleton() {
    document.getElementById('skeleton-list').style.display = 'none';
  }

  function showError(msg) {
    const el = document.getElementById('error-state');
    el.textContent = `Error: ${msg}`;
    el.classList.add('visible');
    document.getElementById('header-meta').textContent = 'Failed to load';
  }

  // ── Action stubs ─────────────────────────────────────────────

  }

  function handleStop(sessionId) {
    console.log('Stop session:', sessionId);

  }

  // ── Init ─────────────────────────────────────────────────────
  loadSessions();
</script>

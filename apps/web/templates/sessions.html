<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIKELEASE — Sessions</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/sessions.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">BIKE<span>LEASE</span></div>
  <div class="header-meta" id="header-meta">Loading sessions…</div>
</header>

<!-- PAGE TITLE -->
<div class="page-header">
  <div class="page-badge">Rental Activity</div>
  <h1 class="page-title">ALL <span>SESSIONS</span><span class="count-chip" id="count-chip" style="display:none"><span class="dot active" id="live-dot"></span><span id="count-text">0</span></span></h1>
  <div class="shop-id-display" id="shop-id-display">SHOP — …</div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- ERROR -->
  <div class="error-state" id="error-state"></div>

  <!-- SKELETON -->
  <div id="skeleton-list">
    <!-- Table header placeholder -->
    <div style="display:grid;grid-template-columns:48px 1.4fr 1fr 1.2fr 0.9fr 0.9fr 96px;gap:20px;padding:0 24px 12px;margin-bottom:4px;">
      <span></span>
      <span class="skeleton" style="height:9px;width:60px;margin-top:4px;border-radius:4px;"></span>
      <span class="skeleton" style="height:9px;width:40px;margin-top:4px;border-radius:4px;"></span>
      <span class="skeleton" style="height:9px;width:50px;margin-top:4px;border-radius:4px;"></span>
      <span class="skeleton" style="height:9px;width:45px;margin-top:4px;border-radius:4px;"></span>
      <span class="skeleton" style="height:9px;width:50px;margin-top:4px;border-radius:4px;"></span>
      <span></span>
    </div>
    <!-- Skeleton rows -->
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:55%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:35%;"></div></div>
      <div><div class="skeleton skel-short"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:50%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:70%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:40%;"></div></div>
      <div><div class="skeleton skel-short" style="width:80%;"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short" style="width:70%;"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge" style="width:90px;"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:40%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:50%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:45%;"></div></div>
      <div><div class="skeleton skel-short" style="width:65%;"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short" style="width:80%;"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge" style="width:68px;"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:55%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:30%;"></div></div>
      <div><div class="skeleton skel-short" style="width:75%;"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short" style="width:60%;"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge" style="width:100px;"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:45%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
    <div class="skeleton-row">
      <div class="skeleton skel-avatar"></div>
      <div><div class="skeleton skel-line" style="width:45%;margin-bottom:8px;"></div><div class="skeleton" style="height:10px;width:38%;"></div></div>
      <div><div class="skeleton skel-short" style="width:85%;"></div></div>
      <div class="skel-col3"><div class="skeleton skel-short" style="width:55%;"></div></div>
      <div class="skel-col4"><div class="skeleton skel-badge" style="width:76px;"></div></div>
      <div class="skel-col5"><div class="skeleton" style="height:12px;width:50%;"></div></div>
      <div class="skeleton skel-btn"></div>
    </div>
  </div>

  <!-- TABLE HEADER (visible after load) -->
  <div class="table-header" id="table-header">
    <span></span>
    <span>Customer</span>
    <span>Bike</span>
    <span class="th-start">Started</span>
    <span class="th-stop">Stopped</span>
    <span>Duration / Amount</span>
    <span></span>
  </div>

  <!-- SESSIONS -->
  <div class="sessions-list" id="sessions-list"></div>

  <!-- EMPTY -->
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">—</div>
    <p>No sessions found for this shop.</p>
  </div>

</div>

<script src="/static/js/sessions.js"></script>
</body>
</html>
